# Copy to NousResearch/hermes-agent as plugin-catalog/youbench.yaml.
# Fill in OWNER and the 40-character commit SHA of the release you want reviewed.
name: youbench
title: YouBench
repo: https://github.com/OWNER/hermes-youbench
sha: 0000000000000000000000000000000000000000
description: "Benchmark models on your own work: save real tasks from your Hermes sessions (prompt + exact starting files), replay them on any models in isolated sandboxes, grade each attempt with your own test command or a judge, and get a leaderboard of pass rate, quality, cost, time and steps, plus a live Desktop page. Disclosure — each replay is a full agent run on the model you choose and is billed by that provider (cases × models runs); judge calls use your active model through ctx.llm. A case's check command runs in each replay sandbox through Hermes's terminal tool (normal approvals apply); replays run terminal and file tools confined to their sandbox by a pre_tool_call guard. Reads your git workspace to snapshot it (writes only unreferenced git objects; never touches your index, branches, stash or refs) and reads Hermes's state.db read-only for replay cost, token and tool counts. Stores cases (prompt, compressed starting files, reference diff), replay sandboxes and reports under <HERMES_HOME>/plugin-data/youbench/. No network calls of its own, no telemetry, no stored credentials, no self-updater."
maintainer: OWNER
tier: community
category: models
requires_hermes: ">=0.23.0"
docs_url: https://github.com/OWNER/hermes-youbench
version: "0.1.0"
platforms: []
capabilities:
  provides_tools:
    - youbench_run
    - youbench_report
    - youbench_cases
  provides_hooks:
    - pre_llm_call
    - post_llm_call
    - pre_tool_call
    - subagent_start
  provides_middleware: []
  requires_env: []
